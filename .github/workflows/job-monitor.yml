name: Scheduled Instagram Job Alert Worker

on:
  schedule:
    # Trigger execution every 2 hours (00:00, 02:00, 04:00 ... UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual "Run Workflow" trigger from GitHub Actions UI

jobs:
  run-job-monitor:
    runs-on: ubuntu-latest
    name: Run Instagram Monitoring Cycle
    
    # Environment variables available across ALL steps in the job
    env:
      POLL_INTERVAL_HOURS: '2'
      INSTAGRAM_ADAPTER_MODE: ${{ secrets.INSTAGRAM_ADAPTER_MODE }}
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      APIFY_ACTOR_ID: ${{ secrets.APIFY_ACTOR_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_TO: vivekdandotiya772@gmail.com
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify production checkout
        run: |
          echo "====================================================="
          echo "           GITHUB ACTIONS WORKFLOW CHECKOUT          "
          echo "====================================================="
          echo "Git commit SHA:"
          git rev-parse HEAD

          echo "Git branch:"
          git branch --show-current || true

          echo "Prisma schema header:"
          sed -n '1,10p' prisma/schema.prisma

          echo "Prisma provider:"
          grep -n 'provider' prisma/schema.prisma
          echo "====================================================="

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Production Preflight Check
        run: |
          echo "====================================================="
          echo "            PRODUCTION PREFLIGHT CHECK               "
          echo "====================================================="
          
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL GitHub secret is missing!"
            exit 1
          fi

          case "$DATABASE_URL" in
            postgresql://*|postgres://*)
              echo "[OK] DATABASE_URL protocol is valid PostgreSQL."
              ;;
            *)
              echo "ERROR: DATABASE_URL must be a PostgreSQL URL (starting with postgresql:// or postgres://)."
              exit 1
              ;;
          esac

          if grep -q 'provider = "postgresql"' prisma/schema.prisma; then
            echo "[OK] Prisma datasource provider is verified as postgresql."
          else
            echo "ERROR: Production Prisma schema is not configured for postgresql!"
            exit 1
          fi
          
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "ERROR: APIFY_API_TOKEN GitHub secret is missing!"
            exit 1
          else
            echo "[OK] APIFY_API_TOKEN secret is present."
          fi

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID GitHub secret is missing!"
            exit 1
          else
            echo "[OK] Telegram bot credentials are present."
          fi

          if [ -z "$RESEND_API_KEY" ]; then
            echo "[NOTICE] RESEND_API_KEY secret is not yet set. Email alerts will log warning until secret is added."
          else
            echo "[OK] RESEND_API_KEY secret is present."
          fi
          echo "====================================================="

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Generate Prisma Client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Synchronize Database Schema
        run: npx prisma db push --schema=prisma/schema.prisma

      - name: Compile Backend TypeScript
        run: npm run build:backend

      - name: Execute Scheduled Check Cycle
        run: npm run run-cycle
